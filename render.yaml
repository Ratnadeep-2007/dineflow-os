services:
  # ─── 1. NestJS Backend API Web Service ─────────────────────────
  - type: web
    name: dineflow-backend-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: dineflow-postgres
          property: connectionString
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: 6379
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false # Set in Render Dashboard

  # ─── 2. WhatsApp Baileys Gateway Worker ───────────────────────
  - type: worker
    name: dineflow-baileys-gateway
    runtime: node
    rootDir: baileys-gateway
    plan: free
    buildCommand: npm install
    startCommand: npm run dev
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: dineflow-backend-api
          property: host
      - key: MENU_DASHBOARD_URL
        value: https://frontend-omega-three-uepnn9gfyr.vercel.app/menu
      - key: MAX_DAILY_MESSAGES
        value: 300

# ─── 3. Managed PostgreSQL Database ─────────────────────────────
databases:
  - name: dineflow-postgres
    plan: free
    databaseName: wp_automation
    user: postgres
